name: Publish AI project pages
on:
  push:
    branches: [codex/ppcb-deployment]
    paths:
      - 'project-pages/**'
      - '.github/workflows/project-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: project-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: project-pages
      - name: Deploy project pages
        id: deployment
        uses: actions/deploy-pages@v4
