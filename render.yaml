services:
  - type: web
    name: palmpay-design-hub-api-test
    runtime: docker
    plan: free
    region: singapore
    branch: codex/v1-project-handoff
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/health
    initialDeployHook: >-
      cd /app && pnpm --filter @palmpay/api prisma:seed &&
      pnpm --filter @palmpay/api prisma:bootstrap:test &&
      pnpm --filter @palmpay/api prisma:import:v9-1-projects &&
      pnpm --filter @palmpay/api prisma:import:v9-1-ai-catalog &&
      pnpm --filter @palmpay/api prisma:import:v9-1-design-assets
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: palmpay-design-hub-test-db-v2
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: test
      - key: AUTH_AUTO_PROVISION
        value: "false"
      - key: DEFAULT_ORGANIZATION_CODE
        value: palmpay-experience-design
      - key: TEST_AUTH_SESSION_SECRET
        generateValue: true
      - key: TEST_AUTH_SESSION_TTL_SECONDS
        value: "28800"
      - key: TEST_BOOTSTRAP_ADMIN_EMAIL
        value: lomi2026@126.com
      - key: TEST_BOOTSTRAP_ADMIN_NAME
        value: PalmPay Test Administrator
      - key: WEB_ORIGIN
        sync: false
      - key: FILE_STORAGE_DRIVER
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        value: palmpay-design-hub-test
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_SIGNED_URL_TTL_SECONDS
        value: "300"

databases:
  - name: palmpay-design-hub-test-db-v2
    plan: free
    region: singapore
    databaseName: palmpay_design_hub_test
    user: palmpay
    postgresMajorVersion: "17"
